[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtikit-ai"
version = "0.1.0"
description = "RTIKit AI Agent package powered by Strands Agents SDK and Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents",
    "boto3>=1.28.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
